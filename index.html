<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: 'Arial', sans-serif;
      background-color: #111;
      color: #fff;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 20px 0;
      background-color: rgba(0, 0, 0, 0.8);
      text-align: center;
    }

    header a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-size: 18px;
    }

    /* Main Section (Hero) */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #222;
      color: #fff;
      text-align: center;
      flex-direction: column;
    }

    .hero h1 {
      font-size: 50px;
      font-weight: bold;
    }

    .hero p {
      font-size: 20px;
      margin-top: 10px;
    }

    /* Portfolio Section */
    .portfolio {
      padding: 100px 0;
      background-color: #333;
      text-align: center;
    }

    .portfolio h2 {
      font-size: 40px;
      margin-bottom: 40px;
    }

    .portfolio .project {
      display: inline-block;
      width: 250px;
      height: 200px;
      margin: 10px;
      background-color: #444;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .portfolio .project:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    .portfolio img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Footer */
    footer {
      padding: 20px;
      background-color: #111;
      text-align: center;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#">Home</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to My Portfolio</h1>
    <p>Crafting beautiful digital experiences</p>
  </section>

  <!-- Portfolio Section -->
  <section id="portfolio" class="portfolio">
    <h2>My Projects</h2>
    <div class="project">
      <img src="your-image.jpg" alt="Project 1">
    </div>
    <div class="project">
      <img src="your-image.jpg" alt="Project 2">
    </div>
    <div class="project">
      <img src="your-image.jpg" alt="Project 3">
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 My Portfolio</p>
  </footer>

</body>
</html>
