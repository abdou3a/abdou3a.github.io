<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Avocat Cybersécurité & Solutions Technologiques</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <meta name="description" content="Portfolio - Avocat spécialisé en cybersécurité et vendeur de solutions technologiques">
    <meta name="keywords" content="Avocat, Cybersécurité, Droit numérique, Solutions technologiques, RGPD">
    
    <style>
        /* Critical CSS for loading */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            color: white;
            overflow-x: hidden;
        }
        
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .cybersecurity-theme {
            background: linear-gradient(135deg, #0a0a0a 0%, #1e3c72 50%, #2a5298 100%);
        }
        
        .law-accent {
            color: #ffd700;
        }
        
        .tech-accent {
            color: #00ff88;
        }
        
        .security-accent {
            color: #ff4757;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 215, 0, 0.3);
            border-top: 4px solid #ffd700;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }
        
        /* Enhanced loading animation */
        .loader::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 2px solid rgba(0, 255, 136, 0.3);
            border-top: 2px solid #00ff88;
            border-radius: 50%;
            animation: spin-reverse 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes spin-reverse {
            0% { transform: translate(-50%, -50%) rotate(360deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); }
        }
        
        /* Hide scrollbar for Webkit browsers */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 212, 255, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="cybersecurity-theme">
    <noscript>Vous devez activer JavaScript pour utiliser cette application.</noscript>
    
    <div id="loading-screen">
        <div class="loader"></div>
        <p style="margin-top: 20px; color: #ffd700;">Chargement du portfolio...</p>
    </div>
    
    <div id="root"></div>
    
    <!-- Enhanced error handling -->
    <script>
        // Error boundary for React
        window.addEventListener('error', (e) => {
            console.error('Application Error:', e.error);
            const errorDiv = document.createElement('div');
            errorDiv.innerHTML = `
                <div style="position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
                           background: rgba(255, 71, 87, 0.9); color: white; padding: 2rem; 
                           border-radius: 10px; text-align: center; z-index: 10000;">
                    <h3>Erreur d'application</h3>
                    <p>Une erreur s'est produite. Veuillez rafraîchir la page.</p>
                    <button onclick="location.reload()" style="margin-top: 1rem; padding: 0.5rem 1rem; 
                           background: white; color: #ff4757; border: none; border-radius: 5px; cursor: pointer;">
                        Rafraîchir
                    </button>
                </div>
            `;
            document.body.appendChild(errorDiv);
        });

        // Remove loading screen when React loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loading-screen');
                if (loadingScreen) {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.remove();
                    }, 500);
                }
            }, 1000);
        });
    </script>
</body>
</html>
