<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    /* Basic Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body */
    body {
      font-family: 'Inter', sans-serif;
      background-color: #121212; /* Dark background */
      color: #f5f5f5; /* Light text */
      overflow-x: hidden;
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      padding: 30px 10%;
      text-align: center;
      z-index: 999;
    }

    header a {
      color: #f5f5f5;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      margin: 0 30px;
    }

    /* Hero Section */
    .hero {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background-color: #2C3E50; /* Accent Color */
      flex-direction: column;
      padding: 0 5%;
    }

    .hero h1 {
      font-size: 80px;
      font-weight: 700;
      letter-spacing: 5px;
    }

    .hero p {
      font-size: 22px;
      font-weight: 300;
      margin-top: 20px;
      letter-spacing: 2px;
    }

    /* Portfolio Section */
    #portfolio {
      padding: 100px 0;
      background-color: #1A1A1A; /* Dark section for portfolio */
      text-align: center;
    }

    #portfolio h2 {
      font-size: 40px;
      margin-bottom: 40px;
    }

    .portfolio-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 30px;
      padding: 0 5%;
    }

    .portfolio-item {
      position: relative;
      background-color: #34495E; /* Accent color for projects */
      border-radius: 10px;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .portfolio-item:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }

    .portfolio-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 0.3s ease;
    }

    .portfolio-item:hover img {
      opacity: 0.8;
    }

    .portfolio-item::after {
      content: "View Project";
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      opacity: 0;
      transition: all 0.3s ease;
    }

    .portfolio-item:hover::after {
      opacity: 1;
    }

    /* Footer Section */
    footer {
      background-color: #2C3E50;
      padding: 40px;
      text-align: center;
      color: #fff;
    }

    footer p {
      font-size: 18px;
      font-weight: 300;
    }

    /* Smooth Scroll */
    html {
      scroll-behavior: smooth;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .hero h1 {
        font-size: 60px;
      }

      .hero p {
        font-size: 18px;
      }

      .portfolio-container {
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <a href="#home">Home</a>
    <a href="#portfolio">Portfolio</a>
    <a href="#contact">Contact</a>
  </header>

  <!-- Hero Section -->
  <section class="hero" id="home">
    <h1>I'm Jane Doe</h1>
    <p>Creative Developer & Designer</p>
  </section>

  <!-- Portfolio Section -->
  <section id="portfolio">
    <h2>My Work</h2>
    <div class="portfolio-container">
      <div class="portfolio-item">
        <img src="project1.jpg" alt="Project 1">
      </div>
      <div class="portfolio-item">
        <img src="project2.jpg" alt="Project 2">
      </div>
      <div class="portfolio-item">
        <img src="project3.jpg" alt="Project 3">
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2024 Jane Doe</p>
  </footer>

</body>
</html>
